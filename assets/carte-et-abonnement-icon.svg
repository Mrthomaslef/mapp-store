<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Subtle card border -->
  <rect x="44" y="88" width="424" height="336" rx="36" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>
  <!-- Ticket notch left & right -->
  <circle cx="44" cy="256" r="24" fill="#064e3b"/>
  <circle cx="468" cy="256" r="24" fill="#052e16"/>
  <!-- Gold badge / Giraffe Monolith motif (Parc Zoologique de Paris Grand Rocher + QR) -->
  <path d="M128 356 L172 152 L212 184 L238 356 Z" fill="url(#gold)" opacity="0.92"/>
  <circle cx="152" cy="144" r="14" fill="#34d399"/>
  <!-- Stylised QR code on right side of pass -->
  <g transform="translate(272, 168)" fill="#ffffff">
    <rect x="0" y="0" width="56" height="56" rx="10" fill="none" stroke="#ffffff" stroke-width="10"/>
    <rect x="16" y="16" width="24" height="24" rx="4"/>
    <rect x="88" y="0" width="56" height="56" rx="10" fill="none" stroke="#ffffff" stroke-width="10"/>
    <rect x="104" y="16" width="24" height="24" rx="4"/>
    <rect x="0" y="88" width="56" height="56" rx="10" fill="none" stroke="#ffffff" stroke-width="10"/>
    <rect x="16" y="104" width="24" height="24" rx="4"/>
    <rect x="88" y="88" width="24" height="24" rx="4" fill="#34d399"/>
    <rect x="120" y="88" width="24" height="24" rx="4"/>
    <rect x="88" y="120" width="24" height="24" rx="4"/>
    <rect x="120" y="120" width="24" height="24" rx="4" fill="#fbbf24"/>
  </g>
</svg>
