<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A0B2E"/>
      <stop offset="50%" stop-color="#281042"/>
      <stop offset="100%" stop-color="#0F1738"/>
    </linearGradient>
    <radialGradient id="aura" cx="256" cy="270" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1A0B2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bagBody" x1="110" y1="150" x2="402" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="38%" stop-color="#E879F9"/>
      <stop offset="72%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="handleBack" x1="180" y1="70" x2="310" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="handleFront" x1="190" y1="65" x2="330" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="185" y1="210" x2="325" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="48%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#090418" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cosmic Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <circle cx="256" cy="270" r="220" fill="url(#aura)"/>

  <!-- Floating Sparkles & Stars -->
  <g fill="#FDE047" opacity="0.9">
    <path d="M92 120 L100 138 L118 146 L100 154 L92 172 L84 154 L66 146 L84 138 Z"/>
    <path d="M424 108 L430 122 L444 128 L430 134 L424 148 L418 134 L404 128 L418 122 Z"/>
    <circle cx="430" cy="240" r="7" fill="#38BDF8"/>
    <circle cx="82" cy="310" r="6" fill="#F472B6"/>
    <circle cx="140" cy="90" r="5" fill="#C084FC"/>
  </g>

  <!-- Back Bag Handle -->
  <path d="M186 175 C186 92, 296 92, 296 175" stroke="url(#handleBack)" stroke-width="26" stroke-linecap="round"/>

  <!-- 3D Shopping Bag Body -->
  <g filter="url(#shadow)">
    <path d="M126 168 C126 150, 140 138, 158 138 L354 138 C372 138, 386 150, 386 168 L406 404 C408 426, 391 444, 368 444 L144 444 C121 444, 104 426, 106 404 Z" fill="url(#bagBody)"/>
    <!-- Glossy Top Highlight -->
    <path d="M136 168 C136 156, 146 148, 158 148 L354 148 C366 148, 376 156, 376 168 L378 195 L134 195 Z" fill="#FFFFFF" fill-opacity="0.22"/>
  </g>

  <!-- Bag Grommets & Front Handle -->
  <circle cx="196" cy="176" r="18" fill="#230E3B"/>
  <circle cx="316" cy="176" r="18" fill="#230E3B"/>
  <path d="M196 176 C196 76, 316 76, 316 176" stroke="url(#handleFront)" stroke-width="28" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M196 176 C196 76, 316 76, 316 176" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="8" stroke-linecap="round"/>

  <!-- Glowing Portal Hexagon on Bag -->
  <polygon points="256,192 352,246 352,354 256,408 160,354 160,246" fill="#180A30" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="256,206 338,253 338,347 256,394 174,347 174,253" fill="none" stroke="#F472B6" stroke-opacity="0.65" stroke-width="4" stroke-linejoin="round"/>

  <!-- Chunky 3D 'M' inside Portal -->
  <g filter="url(#shadow)">
    <!-- 3D Extrusion Depth -->
    <path d="M190 364 V242 H224 L256 296 L288 242 H322 V364 H290 V298 L266 338 H246 L222 298 V364 Z" fill="#831843" transform="translate(-5, 8)"/>
    <!-- Front Letter M -->
    <path d="M190 364 V242 H224 L256 296 L288 242 H322 V364 H290 V298 L266 338 H246 L222 298 V364 Z" fill="url(#mGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Mini Floating Heart Badge (Top Left) -->
  <g transform="translate(64, 178) rotate(-14)" filter="url(#shadow)">
    <rect x="0" y="0" width="88" height="62" rx="31" fill="#F43F5E" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M44 46 C44 46 24 33 24 21 C24 15 29 11 35 11 C39 11 42 13 44 16 C46 13 49 11 53 11 C59 11 64 15 64 21 C64 33 44 46 44 46 Z" fill="#FEF08A"/>
  </g>

  <!-- Mini Stethoscope / Medical Cross Badge (Top Right) -->
  <g transform="translate(366, 152) rotate(12)" filter="url(#shadow)">
    <circle cx="38" cy="38" r="34" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M38 20 V56 M20 38 H56" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
    <path d="M38 20 V56 M20 38 H56" stroke="#FEF08A" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
