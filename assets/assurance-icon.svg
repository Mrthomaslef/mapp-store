<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="128" y1="80" x2="384" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="180" y1="150" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" stroke="rgba(255,255,255,0.14)" stroke-width="4"/>

  <!-- Subtle Grid / Radial Glow -->
  <circle cx="256" cy="240" r="190" fill="url(#shieldGrad)" opacity="0.16" filter="url(#glow)"/>

  <!-- Main Protection Shield (Assurances) -->
  <path d="M256 68L116 126V242C116 338.5 175.8 422.4 256 452C336.2 422.4 396 338.5 396 242V126L256 68Z"
        fill="rgba(15, 23, 42, 0.85)"
        stroke="url(#shieldGrad)"
        stroke-width="16"
        stroke-linejoin="round"/>

  <!-- Inner Shield Accent -->
  <path d="M256 96L142 143V240C142 320 190.5 390.5 256 417C321.5 390.5 370 320 370 240V143L256 96Z"
        fill="url(#shieldGrad)"
        opacity="0.18"/>

  <!-- Document / Fiscal Sheet Inside Shield -->
  <rect x="184" y="152" width="144" height="184" rx="18" fill="#0f172a" stroke="#f8fafc" stroke-width="10"/>
  <path d="M214 196H298" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <path d="M214 232H276" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <path d="M214 268H264" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>

  <!-- Checkmark Badge & Euro / Tax Coin -->
  <circle cx="324" cy="316" r="52" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="10"/>
  <text x="324" y="335" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="56">€</text>

  <!-- Emerald Shield Check Top Right -->
  <circle cx="348" cy="148" r="34" fill="#10b981" stroke="#0f172a" stroke-width="8"/>
  <path d="M333 148L344 159L365 137" stroke="#0f172a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
