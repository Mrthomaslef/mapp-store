<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="20%" stop-color="#10b981" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="3"/>

  <!-- Back Drive Folder Tab -->
  <path d="M108 320 L212 320 L236 344 L404 344 C418 344 428 354 428 368 L428 424 C428 438 418 448 404 448 L108 448 C94 448 84 438 84 424 L84 344 C84 330 94 320 108 320 Z" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="3"/>

  <!-- Paper Document Sheet -->
  <g filter="url(#shadow)">
    <path d="M144 86 L326 86 L376 136 L376 386 C376 398 366 408 354 408 L144 408 C132 408 122 398 122 386 L122 108 C122 96 132 86 144 86 Z" fill="url(#docGrad)"/>
    <path d="M326 86 L326 126 C326 132 330 136 336 136 L376 136 Z" fill="#cbd5e1"/>
  </g>

  <!-- Document Text Lines & AI Tag -->
  <rect x="154" y="126" width="92" height="22" rx="6" fill="#0ea5e9" opacity="0.18"/>
  <text x="164" y="142" font-family="-apple-system, SF Pro Display, sans-serif" font-size="13" font-weight="800" fill="#0284c7">PDF • IA</text>
  <rect x="154" y="166" width="168" height="12" rx="6" fill="#334155"/>
  <rect x="154" y="192" width="136" height="10" rx="5" fill="#64748b"/>
  <rect x="154" y="214" width="182" height="10" rx="5" fill="#64748b"/>
  <rect x="154" y="264" width="152" height="10" rx="5" fill="#94a3b8"/>
  <rect x="154" y="286" width="118" height="10" rx="5" fill="#94a3b8"/>

  <!-- Signature Scribble -->
  <path d="M268 316 Q284 294 296 314 T326 304 T346 316" fill="none" stroke="#4f46e5" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Laser Scan Beam & Glow -->
  <rect x="86" y="242" width="340" height="72" fill="url(#laserGlow)"/>
  <rect x="74" y="238" width="364" height="8" rx="4" fill="url(#beamGrad)"/>

  <!-- iPhone Camera Viewfinder Brackets (4 Corners) -->
  <g stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M78 118 L78 76 C78 68 84 62 92 62 L134 62"/>
    <path d="M378 62 L420 62 C428 62 434 68 434 76 L434 118"/>
    <path d="M78 300 L78 342 C78 350 84 356 92 356 L134 356"/>
    <path d="M434 300 L434 342 C434 350 428 356 420 356 L378 356"/>
  </g>

  <!-- Front Google Drive / Smart Folder Pocket -->
  <g filter="url(#shadow)">
    <path d="M84 358 L428 358 L416 436 C414 448 404 456 392 456 L120 456 C108 456 98 448 96 436 Z" fill="url(#folderGrad)"/>
    <!-- Renamed Filename Pill on Folder -->
    <rect x="132" y="384" width="248" height="44" rx="14" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="158" cy="406" r="10" fill="#10b981"/>
    <path d="M153 406 L157 410 L164 402" fill="none" stroke="#052e16" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800" fill="#f8fafc">2026-11_Contrat.pdf</text>
  </g>
</svg>
